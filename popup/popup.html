<!DOCTYPE html>
<html lang="en" class = "dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator And Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="popup.js" defer></script>
  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fade-in 0.5s ease-out forwards;
    }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-black dark:text-white transition-all duration-500 p-4 max-w-xs mx-auto font-sans">
  <div class="flex justify-end items-center gap-2 mb-2">
    <span class="text-sm">🌞</span>
    <label class="relative inline-flex items-center cursor-pointer">
      <input type="checkbox" id="theme-toggle" class="sr-only peer">
      <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none peer-checked:bg-blue-600 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:left-1 after:top-1 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
    </label>
    <span class="text-sm">🌙</span>
  </div>

  <h1 class="text-2xl font-bold text-center mb-4 animate-fade-in">Password Manager</h1>

  <div class="mb-4 animate-fade-in">
    <label class="block text-sm font-semibold mb-1">Password Length:</label>
    <input type="number" id="password-length" value="12" min="4" max="32" class="w-full p-2 border rounded-md mb-4 bg-white dark:bg-gray-700" />
  </div>

  <div class="mb-4 animate-fade-in">
    <label class="block text-sm font-semibold mb-1">Include Characters:</label>
    <div class="grid grid-cols-2 gap-4 mb-2">
      <label><input type="checkbox" id="include-lower" checked /> Lowercase</label>
      <label><input type="checkbox" id="include-upper" checked /> Uppercase</label>
      <label><input type="checkbox" id="include-numbers" checked /> Numbers</label>
      <label><input type="checkbox" id="include-symbols" checked /> Symbols</label>
    </div>
  </div>

  <div class="mb-4 animate-fade-in">
    <input id="generated-password" type="text" class="w-full p-2 border rounded-md mb-2 bg-white dark:bg-gray-700 font-mono" readonly>
    <button onclick="generatePassword()" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white p-2 rounded-md transition duration-200 transform hover:scale-105">
      Generate Password
    </button>
  </div>

  <div id="strength-meter" class="text-sm mb-4 text-center animate-fade-in">Strength: <span class="font-bold text-gray-500">-</span></div>

  <div id="save-prompt" class="mt-4 text-center animate-fade-in"></div>
</body>
</html>
